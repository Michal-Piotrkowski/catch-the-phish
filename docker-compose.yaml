services:
  backend:
    build: ./catch-the-phish-backend
    container_name: nest_api
    ports:
      - "3000:3000"
    env_file:
      - ./catch-the-phish-backend/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    networks:
      - phish-network

  ml-service:
    build: ./catch-the-phish-ml-service
    container_name: ml_service
    ports:
      - "8000:8000"
    env_file:
      - ./catch-the-phish-ml-service/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    networks:
      - phish-network

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: on-failure
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - phish-network

networks:
  phish-network:
    driver: bridge